name: Build & deploy CV

on:
  schedule:
    - cron: "17 4 * * 1" # every Monday 04:17 UTC (07:17 MSK)
  workflow_dispatch: # "Run workflow" button for an immediate refresh
  push:
    branches: [main]

permissions:
  contents: write # commit synced content/ back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Pull CV from Google Docs
        env:
          GOOGLE_DOC_ID: ${{ vars.GOOGLE_DOC_ID }}
        run: python scripts/cv.py fetch

      - name: Build site
        run: python scripts/cv.py build

      - name: Commit CV changes
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "Sync CV from Google Docs"
            git push
          else
            echo "CV unchanged"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
